<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#244B36"><link rel="apple-touch-icon" href="/icon-192.png"><title>À table</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--c:#FAF7EF;--g:#244B36;--o:#C4501F;--s:#E8ECDD;--t:#1f2a24;--m:#5b6560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--c);color:var(--t);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Lora,Georgia,serif;color:var(--g);margin:.2em 0}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 20px;border-bottom:1px solid #e3dfd0;position:sticky;top:0;background:var(--c);z-index:5}
header img{height:48px}nav{display:flex;flex-wrap:wrap;gap:4px}
nav button,.chip{border:1px solid #d9dcc9;background:#fff;border-radius:99px;padding:10px 16px;min-height:44px;font:inherit;cursor:pointer;color:var(--g)}
nav button[aria-current=page],.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:1000px;margin:auto;padding:20px}
.btn{background:var(--o);color:#fff;border:0;border-radius:12px;padding:12px 20px;min-height:48px;font:600 1rem Inter;cursor:pointer}.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1b6fd1;outline-offset:2px}
.card{background:#fff;border:1px solid #e6e2d3;border-radius:18px;box-shadow:0 2px 8px #0000000d;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card img{width:100%;height:150px;object-fit:cover;display:block}.pad{padding:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.hero img{width:100%;border-radius:24px;max-height:380px;object-fit:cover}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.eyebrow{letter-spacing:.14em;font-size:.8rem;color:var(--g)}.band{background:var(--s);border-radius:18px;padding:18px;margin:20px 0}
input,select{font:inherit;padding:10px;border:1px solid #bbb;border-radius:10px;min-height:44px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.sp{justify-content:space-between}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:1.05rem}.it input[type=checkbox]{width:28px;height:28px;accent-color:var(--g)}
.it.d span{text-decoration:line-through;color:var(--m)}.tag{font-size:.82rem;background:var(--s);color:var(--g);border-radius:8px;padding:2px 8px}.warn{background:#fff3cd;color:#5c4400}
.bar{height:10px;background:var(--s);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.demo{font-size:.78rem;color:var(--m)}
@media print{header,.noprint{display:none}}@media(prefers-reduced-motion:no-preference){.card,.btn{transition:transform .2s}.card:hover{transform:translateY(-2px)}}
</style></head><body>

function consume(){const c=S.c,r=RC.find(x=>x.id===c.r);if(S.cons[c.sid])return;const st=stk(),L=r.i.map(([k,q])=>[k,Math.min(st[k]||0,q*c.s/4)]).filter(x=>x[1]>0);
